name: Bug report / 缺陷报告
description: Report a reproducible problem with synthetic or redacted data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只使用虚构或脱敏数据；安全漏洞请按 SECURITY.md 私下报告。

        Thank you. Use only synthetic or redacted data. Report security vulnerabilities privately as described in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Release tag or commit hash.
      placeholder: v4.8.1
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment / 部署方式
      options:
        - Docker Compose
        - Manual / 手动部署
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Use invented names, questions, and images.
      placeholder: |
        1. Open ...
        2. Enter synthetic data ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs / 实际行为与脱敏日志
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      placeholder: Chrome 140, Android 16, Node 22, MySQL 8.4

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I removed all child/family data, passwords, API keys, hostnames, IPs, and database exports.
          required: true
        - label: This is not a security vulnerability; if it is, I will report it privately.
          required: true
