name: Feature request / 功能建议
description: Propose a focused improvement to Peixue.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe the parent or maintainer workflow, without personal data.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change / 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 替代方案

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution / 参与意愿
      options:
        - label: I am willing to help implement or test this with synthetic data.
