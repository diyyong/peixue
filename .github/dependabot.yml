version: 2
updates:
  - package-ecosystem: npm
    directory: /peixue-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /peixue-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /peixue-server
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /peixue-frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
